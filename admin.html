<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burger Barn — Admin</title><style>
:root{--bg:#0e0b08;--surface:#17110d;--card:#20170f;--border:#3a2b1d;--gold:#c9a84c;--text:#f4ead7;--muted:#b7a78f;--red:#d65b4b;--green:#4caf82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.logo{font-weight:800;letter-spacing:1px}.link{background:none;border:0;color:var(--gold);cursor:pointer;font-size:15px}main{max-width:1100px;margin:0 auto;padding:30px 20px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:430px;margin:60px auto}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input,.status{width:100%;background:#0e0b08;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:12px}.btn{border:0;border-radius:9px;padding:12px 18px;background:var(--gold);color:#211707;font-weight:800;cursor:pointer}.error{color:#e88a7e;min-height:20px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.stat{background:var(--card);border:1px solid var(--border);padding:18px;border-radius:14px}.num{font-size:26px;font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tab{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--gold);color:#201707}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}.top{display:flex;justify-content:space-between;gap:10px}.badge{font-size:11px;border:1px solid var(--border);padding:4px 8px;border-radius:999px;color:var(--gold)}h1,h2,h3{margin-top:0}.items{margin:16px 0;color:var(--muted);line-height:1.7}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.section{margin-top:40px}@media(max-width:700px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">🛠️ BURGER BARN · ADMIN</div><div><button class="link" onclick="logout()">Log out</button></div></header>
<section id="login" class="panel"><h2>Staff login</h2><p class="muted">Server-backed admin dashboard.</p><div class="field"><label>Username</label><input id="user" value="admin"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><p id="loginError" class="error"></p><button class="btn" onclick="login()">Log in</button></section>
<main id="dash" class="hidden"><h1>Restaurant dashboard</h1><p class="muted">Live orders and catering requests stored in Supabase.</p><div class="stats"><div class="stat"><div class="num" id="ordersCount">0</div><div class="muted">Orders</div></div><div class="stat"><div class="num" id="revenue">₹0</div><div class="muted">Revenue</div></div><div class="stat"><div class="num" id="leads">0</div><div class="muted">Catering leads</div></div></div><div class="tabs"><button class="tab active" onclick="setFilter('all',this)">All</button><button class="tab" onclick="setFilter('dinein',this)">Dine-in</button><button class="tab" onclick="setFilter('online',this)">Online</button></div><div id="orders" class="grid"></div><div class="section"><h2>Catering requests</h2><div id="catering" class="grid"></div></div></main>
<script>
let token=sessionStorage.getItem('bb_admin_token')||'';let allOrders=[];let allCatering=[];let filter='all';
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...opts,headers});const d=await r.json();if(r.status===401){token='';sessionStorage.removeItem('bb_admin_token');showLogin();throw Error('Admin session expired');}if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d;}
async function login(){const e=document.getElementById('loginError');e.textContent='';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});token=d.token;sessionStorage.setItem('bb_admin_token',token);await load();showDash();}catch(x){e.textContent=x.message;}}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('dash').classList.add('hidden')}
function showDash(){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden')}
async function load(){const [o,c]=await Promise.all([api('/api/admin/orders'),api('/api/admin/catering')]);allOrders=o.orders||[];allCatering=c.requests||[];render();}
function setFilter(f,b){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}
async function status(id,status){try{await api('/api/admin/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await load();}catch(e){alert(e.message)}}
async function cstatus(id,status){try{await api('/api/admin/catering/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await load();}catch(e){alert(e.message)}}
function render(){const os=filter==='all'?allOrders:allOrders.filter(o=>o.order_type===filter);document.getElementById('ordersCount').textContent=allOrders.length;document.getElementById('revenue').textContent=fmt(allOrders.reduce((s,o)=>s+Number(o.total||0),0));document.getElementById('leads').textContent=allCatering.length;document.getElementById('orders').innerHTML=os.length?os.map(o=>`<div class="card"><div class="top"><div><span class="badge">${o.order_type}</span><h3>Order #${o.id}</h3></div><strong>${fmt(o.total)}</strong></div><div class="muted">${o.customer_name||o.customer_email||''}${o.table_number?' · Table '+o.table_number:''}</div><div class="items">${(o.order_items||[]).map(i=>`${i.name} × ${i.quantity}`).join('<br>')}</div><select class="status" onchange="status(${o.id},this.value)">${['New','Preparing','Ready','Served','Out for delivery / ready','Completed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p class="muted">No orders yet.</p>';document.getElementById('catering').innerHTML=allCatering.length?allCatering.map(c=>`<div class="card"><div class="top"><div><span class="badge">Catering</span><h3>${c.company}</h3></div><strong>${c.guests} guests</strong></div><div class="items">${c.email}<br>${c.phone}<br>${c.event_date||'No date'}<br>${c.message||'No notes'}</div><select class="status" onchange="cstatus(${c.id},this.value)">${['New','Contacted','Quoted','Closed'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p class="muted">No catering requests yet.</p>'}
async function logout(){if(token){try{await api('/api/admin/logout',{method:'POST'})}catch{}}token='';sessionStorage.removeItem('bb_admin_token');showLogin();}
if(token){load().then(showDash).catch(showLogin)}
</script></body></html>
